<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../../../Bootstrab/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            min-height: 100vh;
        }

        .profile-card {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            padding: 40px 30px;
            margin-top: 60px;
            text-align: center;
        }

        .profile-header img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #fff;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .profile-header h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #888;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .profile-info .row {
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .profile-info .label {
            font-weight: 600;
            text-align: left;
            color: #555;
        }

        .profile-info .value {
            text-align: right;
            color: #333;
        }

        .profile-info i {
            color: #2575fc;
            margin-left: 8px;
        }

        #editProfileBtn {
            background-color: #2575fc;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            color: #fff;
            transition: 0.3s;
        }

        #editProfileBtn:hover {
            background-color: #6a11cb;
        }

        @media (max-width: 576px) {
            .profile-card {
                padding: 30px 20px;
            }

            .profile-header h3 {
                font-size: 1.5rem;
            }

            .profile-info .row {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="profile-card">

                <!-- Header -->
                <div class="profile-header">
                    <h3>اسم المستخدم</h3>
                    <h5 style="color: #2575fc;" id="userName"></h5>
                    <p class="text-muted">الدور</p>
                    <p style="color: #f83403;"  id="role"></p>
                </div>

                <!-- المعلومات الأساسية -->
                <div class="profile-info text-end">
                    <div class="row">
                        <div class="col-5 label"><i class="fas fa-envelope"></i> البريد الإلكتروني:</div>
                        <div class="col-7 value" id="email"></div>
                    </div>

                    <div class="row">
                        <div class="col-5 label"><i class="fas fa-calendar-alt"></i> تاريخ التسجيل:</div>
                        <div class="col-7 value" id="createAt"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="../../../Bootstrab/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
<script src="../../Auth/SettingAccount/js/SettingAccount.js"></script>
<script src="../../Auth/Login/Js/Auth.js"></script>

<script>
    checkAccess("../../../Wirning/Error.html");
</script>
</body>
</html>
