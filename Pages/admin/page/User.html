<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../../../Bootstrab/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f6f9;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        table th {
            background-color: #0d6efd;
            color: #fff;
            text-align: center;
        }

        table td {
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>

<body>

<div class="container-fluid p-4">

    <!-- فلترة وبحث -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">

                <div class="col-md-3">
                    <label class="form-label">البحث حسب</label>
                    <select id="searchType" class="form-select">
                        <option value="name">اسم المستخدم</option>
                        <option value="email">البريد الإلكتروني</option>
                        <option value="role">الصلاحية</option>
                        <option value="createAt">تاريخ التسجيل</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">قيمة البحث</label>
                    <input
                        type="text"
                        id="searchValue"
                        class="form-control"
                        placeholder="اكتب للبحث..."
                    >
                </div>

            </div>
        </div>
    </div>

    <!-- جدول المستخدمين -->
    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead>
                    <tr>
                        <th>المعرف</th>
                        <th>الاسم</th>
                        <th>البريد الإلكتروني</th>
                        <th>الدور</th>
                        <th>تاريخ التسجيل</th>
                    </tr>
                </thead>
                <tbody id="showuser">
                    <!-- البيانات ستُضاف هنا بواسطة JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Scripts -->
<script src="../../../Bootstrab/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/user.js"></script>
<script src="../../Auth/Login/Js/Auth.js"></script>
<script>
    checkAccess("../../../Wirning/Error.html");
</script>

</body>
</html>
