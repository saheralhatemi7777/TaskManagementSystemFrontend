<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مهمة جديدة</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../../../../Bootstrab/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f6f9;
            padding: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .form-container {
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
    </style>
</head>
<body>

    <h2 class="text-center">إضافة مهمة جديدة</h2>

    <div class="form-container">
        <form id="taskForm">
            <div class="mb-3">
                <label for="title" class="form-label">عنوان المهمة</label>
                <input type="text" class="form-control" id="title" placeholder="أدخل عنوان المهمة" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">الملاحظات</label>
                <textarea class="form-control" id="description" placeholder="أدخل الملاحظات" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label for="status" class="form-label">الحالة</label>
                <select class="form-select" id="status" required>
                    <option value="قيد التنفيذ">قيد التنفيذ</option>
                    <option value="مكتمل">مكتمل</option>
                </select>
            </div>

            <button type="submit"   class="btn btn-primary w-100">حفظ المهمة</button>
        </form>
    </div>

    <script src="../../js/CreateNewTask.js"> </script>
    <script src="../../Auth/Login/Js/Auth.js"></script>
<script>
    checkAccess("../../../Wirning/Error.html");
</script>
</body>
</html>
