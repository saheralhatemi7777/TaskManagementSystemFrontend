<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مهمة جديدة</title>

    <!-- Bootstrap -->

            padding: 30px;

        h2 {
            margin-bottom: 20px;
        }

        .form-container {
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            margin: auto;

            <div class="mb-3">
                <label for="description" class="form-label">الملاحظات</label>
                <textarea class="form-control" id="description"  rows="3"></textarea>
            </div>

            <button id="save"    class="btn btn-primary w-100">حفظ التغيرات</button>
        </form>
    </div>

    <script src="../../../Tasks/js/inProgress.js"> </script>

</html>
