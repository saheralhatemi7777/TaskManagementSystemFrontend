<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - منصة إدارة مهامي</title>

<!-- Bootstrap -->
<link rel="stylesheet" href="../Bootstrap/bootstrap-5.3.2-dist/css/bootstrap.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
    body {
        height: 100vh;
        background: linear-gradient(135deg, #4fd1c5, #0d6efd);
        font-family: 'Cairo', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }

    .register-card {
        background: #ffffff;
        padding: 40px 35px;
        border-radius: 15px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        animation: fadeInUp 0.8s ease;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .register-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 30px 50px rgba(0,0,0,0.25);
    }

    @keyframes fadeInUp {
        from {opacity: 0; transform: translateY(30px);}
        to {opacity: 1; transform: translateY(0);}
    }

    .register-card h2 {
        font-weight: 800;
        color: #0d6efd;
        margin-bottom: 8px;
        text-align: center;
    }

    .register-card p {
        color: #6c757d;
        margin-bottom: 25px;
        font-size: 0.95rem;
        text-align: center;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        text-align: right;
    }

    .input-group {
        display: flex;
        align-items: center;
    }

    .form-control {
        border-radius: 0.25rem;
        border: 1px solid #ced4da;
        padding: 10px 12px;
        font-size: 0.95rem;
        flex: 1;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
        outline: none;
    }

    .input-group-text {
        border-radius: 0.25rem 0 0 0.25rem;
        background-color: #f8f9fa;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 10px;
        border: 1px solid #ced4da;
        margin-left: -1px;
    }

    .error {
        color: #dc3545;
        font-size: 0.85rem;
        margin-top: 3px;
        display: block;
    }

    .btn-register {
        border-radius: 5px;
        padding: 12px;
        font-size: 1rem;
        margin-top: 10px;
        font-weight: 600;
    }

    .terms-text {
        font-size: 0.85rem;
        color: #6c757d;
        margin-top: 15px;
        text-align: center;
    }

    .terms-text a {
        color: #0d6efd;
        text-decoration: none;
        font-weight: 600;
    }

    .terms-text a:hover {
        text-decoration: underline;
    }

    @media(max-width: 576px) {
        .input-group {
            flex-direction: column;
        }
        .input-group-text {
            border-radius: 0.25rem 0.25rem 0 0;
            width: 100%;
            margin-left: 0;
            margin-bottom: 2px;
        }
        .form-control {
            border-radius: 0 0 0.25rem 0.25rem;
        }
    }
</style>
</head>
<body>

<div class="register-card">

    <h2>إنشاء حساب جديد</h2>
    <p>أنشئ حسابك وابدأ بإدارة مهامك بسهولة</p>

    <form id="formload">

        <!-- اسم المستخدم -->
        <div class="form-group">
            <label class="form-label" for="username">اسم المستخدم</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="username" class="form-control" placeholder="اسم المستخدم" required>
            </div>
            <span class="error" id="username-error"></span>
        </div>

        <!-- البريد الإلكتروني -->
        <div class="form-group">
            <label class="form-label" for="email">البريد الإلكتروني</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>
            <span class="error" id="email-error"></span>
        </div>

        <!-- كلمة المرور -->
        <div class="form-group">
            <label class="form-label" for="password">كلمة المرور</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="****" required>
            </div>
            <span class="error" id="password-error"></span>
        </div>

        <!-- تأكيد كلمة المرور -->
        <div class="form-group">
            <label class="form-label" for="checkpassword">تأكيد كلمة المرور</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                <input type="password" id="checkpassword" class="form-control" placeholder="****" required>
            </div>
            <span class="error" id="checkpassword-error"></span>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-register">
            إنشاء حساب
        </button>

    </form>

    <div class="terms-text">
        بإنشائك للحساب، أنت توافق على
        <a href="شروط الاستخدام/terms.Html" target="_blank">الشروط والأحكام وسياسة الخصوصية</a>
    </div>

</div>

<script src="../Bootstrap/bootstrap-5.3.2-dist/js/bootstrap.bundle.min.js"></script>
<script src="SettingAccount/js/CreateNewAccount.js"></script>
</body>
</html>
