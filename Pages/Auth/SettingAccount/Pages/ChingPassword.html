<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل كلمة المرور</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../../../../Bootstrab/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #4fd1c5, #0d6efd);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.2);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            font-weight: 800;
            color: #0d6efd;
            margin-bottom: 10px;
        }

        .login-card p {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-label {
            text-align: right;
            width: 100%;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .btn-login {
            border-radius: 12px;
            padding: 12px;
            font-size: 1.1rem;
        }

        .forgot-password {
            font-size: 0.9rem;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <h2 >تعديل كلمة المرور</h2>
    <p>أدخل الايميل  المسجل  سابقا في نظام إدارة مهامي</p>
    <p style="color: rgb(245, 7, 7); font-size: small;">تحذير🚫</p>
    <p style="color: rgb(245, 7, 7); font-size: small;">عزيزي المستخدم في حال تم تغيير كلمة مرورك لا تستطيع الوصول للموقع الا بها تاكد من بيانات التعديل</p>

    <form id="loadform">
        <div class="mb-3 text-start">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" id="email" class="form-control" placeholder="إيميل" required>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label">كلمة المرور الجديدة</label>
            <input type="password" id="password" class="form-control" placeholder="كلمة المرور" required>
        </div>
         <div class="mb-3 text-start">
            <label class="form-label">تاكيد كلمة المرور</label>
            <input type="password" id="checkpassword" class="form-control" placeholder="تاكيد كلمة المرور" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="../Auth/Login/Page/Login.Html" class="forgot-password text-primary">تسجيل الدخول</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-login">
            تاكيد
        </button>
    </form>
</div>

<script src="Bootstrap/bootstrap-5.3.2-dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/chingpassword.js"></script>
</body>
</html>
